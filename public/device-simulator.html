<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>NEXA Device Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100vh;
      padding: 16px;
    }
    h1 { font-size: 1.25rem; margin-bottom: 12px; color: #00ff9d; }
    .card {
      background: #141414;
      border: 2px solid #000;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 4px 4px 0 #00ff9d;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 2px solid #000;
      border-radius: 10px;
      background: #00ff9d;
      color: #000;
      font-weight: 800;
      font-size: 15px;
      margin-top: 8px;
    }
    button.stop { background: #ff2d95; color: #fff; }
    #log {
      font-family: monospace;
      font-size: 12px;
      background: #000;
      border-radius: 8px;
      padding: 12px;
      max-height: 240px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .status { font-size: 13px; margin-top: 8px; }
    .online { color: #00ff9d; }
  </style>
</head>
<body>
  <h1>NEXA Device Simulator</h1>
  <div class="card">
    <div>Gunakan ini untuk test tanpa APK dulu.</div>
    <div class="status" id="status">Status: Offline</div>
    <button id="btnStart">Start Heartbeat</button>
    <button id="btnStop" class="stop" style="display:none">Stop</button>
  </div>
  <div class="card">
    <div style="font-weight:700; margin-bottom:8px">Command Log</div>
    <div id="log">Menunggu...</div>
  </div>

  <script>
    const deviceId = "test-device-" + Math.random().toString(36).slice(2, 8);
    let timer = null;
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const btnStart = document.getElementById("btnStart");
    const btnStop = document.getElementById("btnStop");

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent = `[${time}] ${msg}\n` + logEl.textContent;
    }

    async function heartbeat() {
      try {
        const res = await fetch("/api/devices", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            deviceId,
            name: "Simulator HP",
            model: "Browser Test",
            battery: 70 + Math.floor(Math.random() * 30),
            ip: "sim-" + deviceId.slice(-4)
          })
        });
        const data = await res.json();
        statusEl.innerHTML = `Status: <span class="online">Online</span> (${deviceId})`;
        if (data.commands && data.commands.length) {
          data.commands.forEach(cmd => {
            log("CMD: " + cmd.type + " → " + JSON.stringify(cmd.payload));
            // Simulasi efek sederhana
            if (cmd.type === "message") {
              alert("PESAN DARI DASHBOARD:\n\n" + (cmd.payload.text || ""));
            }
            if (cmd.type === "line") {
              document.body.style.borderTop = cmd.payload.enabled
                ? `6px solid ${cmd.payload.color === "pink" ? "#ff2d95" : "#00ff9d"}`
                : "none";
            }
            if (cmd.type === "deadpixel" && cmd.payload.enabled) {
              document.body.style.background = ["#ff0000","#00ff00","#0000ff","#ffff00"][Math.floor(Math.random()*4)];
              setTimeout(() => document.body.style.background = "#0a0a0a", 800);
            }
          });
        }
      } catch (e) {
        log("Error: " + e.message);
        statusEl.textContent = "Status: Error";
      }
    }

    btnStart.onclick = () => {
      heartbeat();
      timer = setInterval(heartbeat, 5000);
      btnStart.style.display = "none";
      btnStop.style.display = "block";
      log("Heartbeat started");
    };

    btnStop.onclick = () => {
      clearInterval(timer);
      btnStart.style.display = "block";
      btnStop.style.display = "none";
      statusEl.textContent = "Status: Offline";
      log("Heartbeat stopped");
    };
  </script>
</body>
</html>
